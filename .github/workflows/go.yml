# This workflow will build and test bloop-world

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-Test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    services:
      mongodb:
        image: mongo:4.4.6
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongo
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'

    - name: Build
      run: cd ./server/main && go build
        
    - name: Test
      run: cd ./server/main && go test -v -bench=B*
      env:
        BLOOP_ENV: "dev"

  spa-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@v4

    - name: Check for SPA changes
      id: spa-changes
      uses: dorny/paths-filter@v2
      with:
        filters: |
          spa:
            - 'tools/main/spa/**'

    - name: Set up Node.js
      if: steps.spa-changes.outputs.spa == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: tools/main/spa/package-lock.json

    - name: Install dependencies
      if: steps.spa-changes.outputs.spa == 'true'
      working-directory: tools/main/spa
      run: npm ci

    - name: Run SPA tests
      if: steps.spa-changes.outputs.spa == 'true'
      working-directory: tools/main/spa
      run: npm run test:ci
