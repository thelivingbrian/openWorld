name: SPA

on:
  push:
    branches: [ "main" ]
    paths:
      - 'tools/main/spa/**'
      - '.github/workflows/spa.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'tools/main/spa/**'
      - '.github/workflows/spa.yml'

jobs:
  spa-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: tools/main/spa/package-lock.json

    - name: Install dependencies
      working-directory: tools/main/spa
      run: npm ci

    - name: Run SPA tests
      working-directory: tools/main/spa
      run: npm run test:ci
